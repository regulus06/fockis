<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fockis — Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
/* ============================================================
   FOCKIS — design tokens
   Palette: Fjord (teal, primary) + Amber (secondary) + Coral (tertiary accent)
   Type: Space Grotesk (display) / Inter (body) / JetBrains Mono (data)
   Signature shape: the "Fockis Arch" — asymmetric rounded rectangle
   ============================================================ */
:root{
  --fk-font-display:"Space Grotesk",system-ui,sans-serif;
  --fk-font-body:"Inter",system-ui,sans-serif;
  --fk-font-mono:"JetBrains Mono",ui-monospace,monospace;
  --fk-fjord:#0e7c74; --fk-fjord-bright:#17b3a3; --fk-fjord-soft:#d8f0ec;
  --fk-amber:#e8a33d; --fk-amber-soft:#fbe8c8;
  --fk-coral:#e8604b;
  --fk-arch:22px 22px 22px 8px; --fk-arch-sm:14px 14px 14px 5px; --fk-arch-lg:32px 32px 32px 12px;
  --fk-r-sm:10px; --fk-r-md:16px; --fk-r-lg:22px; --fk-r-pill:999px;
  --fk-shadow-sm:0 1px 2px rgba(15,20,25,.06),0 1px 1px rgba(15,20,25,.04);
  --fk-shadow-md:0 8px 24px rgba(15,20,25,.08),0 2px 6px rgba(15,20,25,.06);
  --fk-shadow-lg:0 20px 48px rgba(15,20,25,.16),0 4px 12px rgba(15,20,25,.08);
  --fk-ease:cubic-bezier(.2,.7,.3,1); --fk-fast:140ms; --fk-med:240ms;
  --fk-sidebar-w:248px; --fk-rail-w:300px; --fk-center-max:600px;
}
[data-theme="light"]{
  --fk-bg:#f5f6f4; --fk-surface:#fff; --fk-sunken:#eef0ed; --fk-border:#e4e7e2; --fk-border-strong:#d3d7d0;
  --fk-text:#171b21; --fk-text-2:#565f6b; --fk-text-3:#8a929c; --fk-on-brand:#fff;
  --fk-verified:#fff; --fk-overlay:rgba(15,18,22,.5); --fk-scrim:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55));
}
[data-theme="dark"]{
  --fk-bg:#0b0e12; --fk-surface:#12161c; --fk-sunken:#0e1116; --fk-border:#262d37; --fk-border-strong:#333c48;
  --fk-text:#eef1f4; --fk-text-2:#a4adb8; --fk-text-3:#6d7580; --fk-on-brand:#06110f;
  --fk-verified:#0b0e12; --fk-overlay:rgba(0,0,0,.65); --fk-scrim:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.7));
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
.shell{overflow-x:clip;}
body{background:var(--fk-bg);color:var(--fk-text);font-family:var(--fk-font-body);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}
input,textarea,select{font-family:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--fk-fjord-bright);outline-offset:2px;border-radius:var(--fk-r-sm);}
.mono{font-family:var(--fk-font-mono);font-variant-numeric:tabular-nums;}
img{max-width:100%;}

/* Shell */
.shell{display:grid;grid-template-columns:1fr;max-width:1600px;margin:0 auto;}
@media (min-width:1024px){.shell{grid-template-columns:var(--fk-sidebar-w) minmax(0,1fr);}}
@media (min-width:1360px){.shell{grid-template-columns:var(--fk-sidebar-w) minmax(0,1fr) var(--fk-rail-w);}}
.sidebar-col{display:none;}
@media (min-width:1024px){.sidebar-col{display:block;position:sticky;top:0;height:100vh;border-right:1px solid var(--fk-border);}}
.center-col{min-width:0;padding:16px 16px 90px;}
@media (min-width:768px){.center-col{padding:20px 20px 48px;}}
@media (min-width:1024px){.center-col{padding:24px 24px 48px;}}
.center-inner{max-width:var(--fk-center-max);margin:0 auto;display:flex;flex-direction:column;gap:20px;}
.rail-col{display:none;}
@media (min-width:1360px){.rail-col{display:block;position:sticky;top:0;height:100vh;overflow-y:auto;border-left:1px solid var(--fk-border);padding:24px 20px;}}

/* Logo */
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--fk-font-display);font-weight:700;font-size:20px;letter-spacing:-.01em;}
.logo-mark{width:30px;height:30px;border-radius:var(--fk-arch-sm);background:linear-gradient(135deg,var(--fk-fjord),var(--fk-fjord-bright));position:relative;flex-shrink:0;}
.logo-mark::after{content:"";position:absolute;inset:8px;border-radius:6px 6px 6px 2px;background:var(--fk-on-brand);opacity:.92;}

/* Sidebar */
.sidebar{height:100%;display:flex;flex-direction:column;padding:20px 16px;}
.sidebar-logo{padding:8px 8px 24px;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--fk-r-md);color:var(--fk-text-2);font-weight:500;font-size:15px;transition:background var(--fk-fast) var(--fk-ease),color var(--fk-fast) var(--fk-ease);position:relative;width:100%;text-align:left;}
.nav-item:hover{background:var(--fk-sunken);color:var(--fk-text);}
.nav-item.active{background:var(--fk-fjord-soft);color:var(--fk-fjord);font-weight:600;}
[data-theme="dark"] .nav-item.active{background:rgba(23,179,163,.14);color:var(--fk-fjord-bright);}
.nav-badge{margin-left:auto;background:var(--fk-coral);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:var(--fk-r-pill);display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
.sidebar-divider{height:1px;background:var(--fk-border);margin:12px 8px;}
.sidebar-profile{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--fk-r-md);width:100%;text-align:left;transition:background var(--fk-fast) var(--fk-ease);}
.sidebar-profile:hover{background:var(--fk-sunken);}
.sidebar-profile-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.sidebar-profile-handle{font-size:12.5px;color:var(--fk-text-3);}
.sidebar-utility{display:flex;align-items:center;gap:8px;padding:8px;margin-top:8px;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--fk-r-pill);color:var(--fk-text-2);transition:background var(--fk-fast) var(--fk-ease),color var(--fk-fast) var(--fk-ease);flex-shrink:0;}
.icon-btn:hover{background:var(--fk-sunken);color:var(--fk-text);}

/* Avatar / badges */
.avatar{border-radius:var(--fk-arch-sm);object-fit:cover;display:block;flex-shrink:0;background:var(--fk-sunken);}
.badge-seller{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--fk-amber);background:var(--fk-amber-soft);border-radius:var(--fk-r-pill);padding:2px 7px 2px 5px;text-transform:uppercase;letter-spacing:.02em;}
[data-theme="dark"] .badge-seller{background:rgba(232,163,61,.16);}
.verified{color:var(--fk-fjord);flex-shrink:0;}

/* Topbar */
.topbar{display:none;align-items:center;gap:16px;padding-bottom:16px;}
@media (min-width:1024px){.topbar{display:flex;}}
.topbar-search{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;background:var(--fk-surface);border:1px solid var(--fk-border);border-radius:var(--fk-r-pill);padding:9px 16px;color:var(--fk-text-3);transition:border-color var(--fk-fast) var(--fk-ease);}
.topbar-search:focus-within{border-color:var(--fk-fjord-bright);}
.topbar-search input{border:none;background:none;outline:none;width:100%;font-size:14px;color:var(--fk-text);}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}

/* Mobile header */
.mobile-header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--fk-border);position:sticky;top:0;z-index:20;background:var(--fk-bg);}
@media (min-width:1024px){.mobile-header{display:none;}}
.mobile-header-actions{margin-left:auto;display:flex;align-items:center;gap:2px;}

/* Stories — "Signal Strip": compact avatar chips with a waveform
   indicator underneath instead of tall full-bleed photo cards. This is
   a deliberate structural departure from the Facebook/Instagram stories
   pattern (no filmstrip of photos, no ring-around-a-circle avatar). */
.stories{position:relative;}
.stories-track{display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:6px 2px;touch-action:pan-x;-webkit-overflow-scrolling:touch;cursor:grab;}
.stories-track:active{cursor:grabbing;}
.stories-track::-webkit-scrollbar{display:none;}
.stories-arrow{display:none;position:absolute;top:38px;transform:translateY(-50%);width:30px;height:30px;border-radius:var(--fk-r-pill);align-items:center;justify-content:center;background:var(--fk-surface);border:1px solid var(--fk-border);box-shadow:var(--fk-shadow-sm);color:var(--fk-text-2);z-index:5;}
@media (min-width:1024px){.stories-arrow{display:flex;}}
.stories-arrow:hover{box-shadow:var(--fk-shadow-md);color:var(--fk-text);}
.stories-arrow.left{left:-14px;} .stories-arrow.right{right:-14px;}

.story-chip{position:relative;flex:0 0 auto;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px 2px;cursor:pointer;border-radius:var(--fk-r-md);transition:background var(--fk-fast) var(--fk-ease);}
.story-chip:hover{background:var(--fk-sunken);}
.story-chip-avatar-wrap{position:relative;width:56px;height:56px;}
.story-chip-avatar{width:56px;height:56px;border-radius:var(--fk-arch);object-fit:cover;display:block;background:var(--fk-sunken);border:2px solid var(--fk-surface);box-shadow:0 0 0 1.5px var(--fk-border);}
.story-chip.unseen .story-chip-avatar{box-shadow:0 0 0 1.5px var(--fk-fjord-bright);}
.story-chip.unseen.is-seller .story-chip-avatar{box-shadow:0 0 0 1.5px var(--fk-amber);}
.story-chip-ping{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--fk-fjord-bright);border:2px solid var(--fk-surface);}
.story-chip.is-seller .story-chip-ping{background:var(--fk-amber);}
.story-chip.unseen .story-chip-ping{animation:fk-ping 1.8s ease-out infinite;}
@keyframes fk-ping{0%{box-shadow:0 0 0 0 rgba(23,179,163,.45);}70%{box-shadow:0 0 0 6px rgba(23,179,163,0);}100%{box-shadow:0 0 0 0 rgba(23,179,163,0);}}
.story-chip.is-seller.unseen .story-chip-ping{animation-name:fk-ping-amber;}
@keyframes fk-ping-amber{0%{box-shadow:0 0 0 0 rgba(232,163,61,.45);}70%{box-shadow:0 0 0 6px rgba(232,163,61,0);}100%{box-shadow:0 0 0 0 rgba(232,163,61,0);}}
@media (prefers-reduced-motion: reduce){.story-chip-ping{animation:none !important;}}
.story-chip-wave{width:44px;height:12px;color:var(--fk-border-strong);}
.story-chip.unseen .story-chip-wave{color:var(--fk-fjord-bright);}
.story-chip.is-seller.unseen .story-chip-wave{color:var(--fk-amber);}
.story-chip-store-badge{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:6px 6px 6px 2px;background:var(--fk-amber);color:#201200;display:flex;align-items:center;justify-content:center;border:2px solid var(--fk-surface);}
.story-chip-name{font-size:11px;font-weight:600;color:var(--fk-text-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.story-chip.unseen .story-chip-name{color:var(--fk-text);}
.story-chip-price{font-size:10px;font-weight:700;color:var(--fk-amber);margin-top:-4px;}

.story-chip.create .story-chip-avatar-wrap{width:56px;height:56px;border-radius:var(--fk-arch);border:1.5px dashed var(--fk-border-strong);display:flex;align-items:center;justify-content:center;color:var(--fk-fjord);background:var(--fk-fjord-soft);}
[data-theme="dark"] .story-chip.create .story-chip-avatar-wrap{background:rgba(23,179,163,.14);color:var(--fk-fjord-bright);}

/* Small screens: tighten the chip size/gaps and enable scroll-snap so the
   rail reads cleanly on narrow phones instead of just overflowing. */
.stories-track{scroll-snap-type:x proximity;}
.story-chip{scroll-snap-align:start;}
@media (max-width:480px){
  .stories-track{gap:2px;padding:6px 0;}
  .story-chip{width:62px;gap:4px;padding:4px 1px 2px;}
  .story-chip-avatar-wrap{width:46px;height:46px;}
  .story-chip-avatar{width:46px;height:46px;}
  .story-chip.create .story-chip-avatar-wrap{width:46px;height:46px;}
  .story-chip-ping{width:12px;height:12px;}
  .story-chip-store-badge{width:16px;height:16px;}
  .story-chip-wave{width:36px;height:10px;}
  .story-chip-name{font-size:10px;}
  .story-chip-price{font-size:9px;}
}
@media (max-width:360px){
  .story-chip{width:56px;}
  .story-chip-avatar-wrap{width:42px;height:42px;}
  .story-chip-avatar{width:42px;height:42px;}
  .story-chip.create .story-chip-avatar-wrap{width:42px;height:42px;}
}

/* Story viewer modal reuses .modal-overlay; the full photo only ever
   appears there, never as the rail thumbnail. */


/* Tabs */
.tabs{display:flex;gap:2px;background:var(--fk-surface);border:1px solid var(--fk-border);border-radius:var(--fk-r-pill);padding:4px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--fk-shadow-sm);}
.tabs::-webkit-scrollbar{display:none;}
.tab-pill{flex:0 0 auto;padding:9px 16px;border-radius:var(--fk-r-pill);font-size:13.5px;font-weight:600;color:var(--fk-text-2);white-space:nowrap;transition:background var(--fk-med) var(--fk-ease),color var(--fk-fast) var(--fk-ease);}
.tab-pill.active{color:var(--fk-on-brand);background:var(--fk-fjord);}
.tab-pill:not(.active):hover{background:var(--fk-sunken);color:var(--fk-text);}

/* Composer */
.composer{background:var(--fk-surface);border:1px solid var(--fk-border);border-radius:var(--fk-r-lg);padding:16px;box-shadow:var(--fk-shadow-sm);}
.composer-row{display:flex;align-items:center;gap:12px;}
.composer-input{flex:1;text-align:left;padding:11px 16px;border-radius:var(--fk-r-pill);background:var(--fk-sunken);color:var(--fk-text-3);font-size:14.5px;transition:background var(--fk-fast) var(--fk-ease);}
.composer-input:hover{background:var(--fk-border);}
.composer-actions{display:flex;gap:2px;margin-top:12px;padding-top:12px;border-top:1px solid var(--fk-border);flex-wrap:wrap;}
.composer-action{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:var(--fk-r-md);font-size:13px;font-weight:600;color:var(--fk-text-2);transition:background var(--fk-fast) var(--fk-ease),color var(--fk-fast) var(--fk-ease);}
.composer-action:hover{background:var(--fk-sunken);color:var(--fk-text);}
.composer-action svg{color:var(--fk-fjord);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:var(--fk-overlay);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:100;overflow-y:auto;animation:fadeIn var(--fk-med) var(--fk-ease);}
.modal{background:var(--fk-surface);border-radius:var(--fk-r-lg);width:100%;max-width:520px;box-shadow:var(--fk-shadow-lg);animation:scaleIn var(--fk-med) var(--fk-ease);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--fk-border);}
.modal-title{font-family:var(--fk-font-display);font-weight:600;font-size:17px;}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px;}
.modal-textarea{width:100%;min-height:100px;resize:vertical;border:none;outline:none;background:none;font-size:16px;line-height:1.5;font-family:inherit;}
.modal-attach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media(min-width:600px){.modal-attach-grid{grid-template-columns:repeat(7,1fr);}}
.modal-attach{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:var(--fk-r-md);border:1px solid var(--fk-border);font-size:11px;font-weight:600;color:var(--fk-text-2);}
.modal-attach svg{color:var(--fk-fjord);}
.modal-attach:hover{background:var(--fk-sunken);}
.modal-attach.active{border-color:var(--fk-fjord);background:var(--fk-fjord-soft);color:var(--fk-fjord);}
[data-theme="dark"] .modal-attach.active{background:rgba(23,179,163,.14);color:var(--fk-fjord-bright);}
.modal-footer{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-top:1px solid var(--fk-border);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--fk-r-pill);font-weight:700;font-size:14px;transition:filter var(--fk-fast) var(--fk-ease),background var(--fk-fast) var(--fk-ease),opacity var(--fk-fast) var(--fk-ease);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--fk-fjord);color:#fff;}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);}
.btn-ghost{background:var(--fk-sunken);color:var(--fk-text);}
.btn-ghost:hover{background:var(--fk-border);}
.btn-sm{padding:6px 13px;font-size:12.5px;}

/* Post card */
.post{background:var(--fk-surface);border:1px solid var(--fk-border);border-radius:var(--fk-r-lg);padding:16px;box-shadow:var(--fk-shadow-sm);}
.post-header{display:flex;align-items:flex-start;gap:12px;}
.post-author-block{flex:1;min-width:0;}
.post-name-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.post-name{font-weight:700;font-size:14.5px;}
.post-meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fk-text-3);margin-top:1px;}
.post-meta-dot{width:3px;height:3px;border-radius:50%;background:currentColor;}
.post-header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.follow-chip{font-size:12.5px;font-weight:700;color:var(--fk-fjord);background:var(--fk-fjord-soft);border-radius:var(--fk-r-pill);padding:6px 12px;white-space:nowrap;}
[data-theme="dark"] .follow-chip{background:rgba(23,179,163,.16);color:var(--fk-fjord-bright);}
.follow-chip.following{color:var(--fk-text-2);background:var(--fk-sunken);}
.post-body{margin-top:12px;}
.post-caption{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.hashtag{color:var(--fk-fjord);font-weight:600;}
[data-theme="dark"] .hashtag{color:var(--fk-fjord-bright);}
.post-media{margin-top:12px;border-radius:var(--fk-r-md);overflow:hidden;position:relative;background:var(--fk-sunken);}
.post-media img{width:100%;display:block;max-height:520px;object-fit:cover;}
.media-grid{display:grid;gap:2px;border-radius:var(--fk-r-md);overflow:hidden;margin-top:12px;}
.media-grid[data-count="3"]{grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr;}
.media-grid[data-count="3"] img:first-child{grid-row:1/span 2;}
.media-grid[data-count="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.media-grid img{width:100%;height:100%;object-fit:cover;display:block;max-height:320px;}
.media-more{position:relative;}
.media-more::after{content:attr(data-more);position:absolute;inset:0;background:rgba(11,14,18,.45);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.play-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.play-circle{width:60px;height:60px;border-radius:50%;background:rgba(11,14,18,.55);backdrop-filter:blur(3px);color:#fff;display:flex;align-items:center;justify-content:center;}
.view-count{position:absolute;bottom:8px;left:8px;background:rgba(11,14,18,.55);color:#fff;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:var(--fk-r-pill);}
.post-stats{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12.5px;color:var(--fk-text-3);}

.dock-btn:hover{background:var(--fk-sunken);color:var(--fk-text);}
.dock-btn.spark.active{color:var(--fk-coral);}
.dock-btn.repost.active{color:var(--fk-fjord);}
[data-theme="dark"] .dock-btn.repost.active{color:var(--fk-fjord-bright);}
.dock-btn.save.active{color:var(--fk-amber);}
.dock-spacer{margin-left:auto;}

.poll{margin-top:12px;display:flex;flex-direction:column;gap:8px;}

.poll-option{position:relative;width:100%;border:1px solid var(--fk-border);border-radius:var(--fk-r-md);padding:10px 12px;overflow:hidden;text-align:left;font-size:13.5px;font-weight:600;}

[data-theme="dark"] .poll-fill{background:rgba(23,179,163,.16);}
.poll-option-content{position:relative;display:flex;justify-content:space-between;gap:8px;}
.poll-pct{color:var(--fk-text-3);}
.poll-total{font-size:12px;color:var(--fk-text-3);}

.product-media img{width:100%;height:100%;object-fit:cover;display:block;}
.product-discount{position:absolute;top:8px;left:8px;background:var(--fk-coral);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:var(--fk-r-sm);}
.product-body{padding:12px 16px;display:flex;align-items:center;gap:12px;}
.product-info{flex:1;min-width:0;}
.product-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.product-price-row{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
.product-price{font-weight:600;color:var(--fk-fjord);font-size:14px;}

.product-compare{font-size:12px;color:var(--fk-text-3);text-decoration:line-through;}
.product-rating{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--fk-text-3);margin-top:2px;}
.product-rating svg{color:var(--fk-amber);}

.property-card{margin-top:12px;border:1px solid var(--fk-border);border-radius:var(--fk-r-md);overflow:hidden;}

.property-type{position:absolute;top:8px;left:8px;background:rgba(11,14,18,.6);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:var(--fk-r-pill);}
.property-price{position:absolute;bottom:8px;left:8px;background:var(--fk-surface);font-weight:700;font-size:14px;padding:6px 11px;border-radius:var(--fk-r-sm);}
.property-body{padding:16px;}
.property-title{font-weight:700;font-size:15px;}
.property-location{font-size:12.5px;color:var(--fk-text-3);margin-top:2px;}
.property-specs{display:flex;gap:16px;margin-top:12px;font-size:12.5px;color:var(--fk-text-2);font-weight:600;}
.property-actions{display:flex;gap:8px;margin-top:16px;}
.property-agent{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--fk-text-3);}

.wave-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.wave-scrim-top{position:absolute;top:0;left:0;right:0;height:90px;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0));pointer-events:none;}

.wave-author-name{font-weight:700;font-size:14px;}
.wave-caption{margin-top:8px;font-size:13.5px;line-height:1.4;}

.market-card-price{font-size:12.5px;font-weight:700;color:var(--fk-fjord);margin-top:1px;}

function renderCaption(text){
  return text.split(/(\s+)/).map((part,i)=> (part.startsWith("#")||part.startsWith("@")) && part.length>1

  const shown = expanded||!isLong ? caption : caption.slice(0,220)+"…";
  return (
    <article className="post">
      <header className="post-header">
        <img className="avatar" src={post.author.avatar} width="44" height="44" alt=""/>

        </div>
        <div className="post-header-actions">
          {!post.author.following && !post.author.friend &&

      </p></div>}

      {post.type==="image" && post.images && (
        <div className="post-media"><img src={post.images[0]} alt=""/>
          {post.viewCount && <span className="view-count">{fmt(post.viewCount)} views</span>}
        </div>

      {post.type==="multi-image" && post.images && (
        <div className="media-grid" data-count={Math.min(post.images.length,4)}>
          {post.images.slice(0,4).map((im,idx)=>{

        <div className="poll">
          <p className="poll-question">{post.poll.question}</p>
          {post.poll.options.map(opt=>{
            const pct = post.poll.totalVotes>0 ? Math.round(opt.votes/post.poll.totalVotes*100) : 0;
            const voted = post.poll.votedOptionId===opt.id;
            return (
              <button key={opt.id} className="poll-option" disabled={!!post.poll.votedOptionId} onClick={()=>actions.onVote(post.id,opt.id)}>
                {post.poll.votedOptionId && <span className="poll-fill" style={{width:pct+"%"}}/>}
                <span className="poll-option-content"><span>{opt.label}{voted?" ✓":""}</span>{post.poll.votedOptionId && <span className="poll-pct mono">{pct}%</span>}</span>
              </button>

          })}

/* ---------- Wave card ---------- */
function WaveCard({post,actions}){
  const frameRef=useRef(null);
  const [playing,setPlaying]=useState(false);
  const [muted,setMuted]=useState(true);
  const [progress,setProgress]=useState(0);
  useEffect(()=>{
    const el=frameRef.current; if(!el) return;
    const obs=new IntersectionObserver(([e])=>setPlaying(e.isIntersecting),{threshold:.6});
    obs.observe(el); return ()=>obs.disconnect();
  },[]);
  useEffect(()=>{
    if(!playing) return;
    const total=post.wave.duration*1000;
    const id=setInterval(()=>setProgress(p=> (p + (100/(total/100))) >=100 ? 0 : p + 100/(total/100)),100);
    return ()=>clearInterval(id);
  },[playing]);
  const w=post.wave;
  return (
    <div className="wave" ref={frameRef}>
      <img className="wave-media" src={w.poster} alt=""/>
      <div className="wave-scrim-top"/><div className="wave-scrim-bottom"/>
      <div className="wave-top-row">
        <span className="wave-badge">Waves</span>
        <div style={{display:"flex",gap:6}}>
          <button className="icon-btn" style={{color:"#fff"}} onClick={()=>setMuted(m=>!m)}>{muted?<IconMute size={18}/>:<IconUnmute size={18}/>}</button>
          <button className="icon-btn" style={{color:"#fff"}}><IconFullscreen size={18}/></button>
        </div>
      </div>
      <button className="wave-center-toggle" onClick={()=>setPlaying(p=>!p)}>
        {!playing && <span className="play-circle" style={{width:68,height:68}}><IconPlay size={26}/></span>}
      </button>
      <div className="wave-meta">
        <div className="wave-author-row"><img className="avatar" src={post.author.avatar} width="30" height="30" alt=""/><span className="wave-author-name">{post.author.name}</span></div>
        {post.caption && <p className="wave-caption">{post.caption}</p>}
        <div className="wave-audio">♪ {w.audioTitle} · {w.audioOwner}</div>
      </div>
      <div className="wave-dock">
        <button className={"wave-dock-btn"+(post.reacted?" active":"")} onClick={()=>actions.onReact(post.id)}>{post.reacted?<IconSparkFilled size={19}/>:<IconSpark size={19}/>}{fmt(post.reactionCount)}</button>
        <button className="wave-dock-btn" onClick={()=>actions.onComment(post.id)}><IconComment size={19}/>{fmt(post.commentCount)}</button>
        <button className={"wave-dock-btn"+(post.reposted?" active":"")} onClick={()=>actions.onRepost(post.id)}><IconRepost size={19}/>{fmt(post.repostCount)}</button>
        <button className="wave-dock-btn" onClick={()=>actions.onShare(post.id)}><IconShare size={19}/>{fmt(post.shareCount)}</button>
        <button className={"wave-dock-btn"+(post.saved?" active":"")} onClick={()=>actions.onSave(post.id)}>{post.saved?<IconSaveFilled size={19}/>:<IconSave size={19}/>}Save</button>
      </div>
      <div className="wave-progress"><div className="wave-progress-fill" style={{width:progress+"%"}}/></div>
    </div>
  );
}

/* ---------- Stories rail ("Signal Strip") ---------- */
function WaveGlyph({color}){
  // A tiny waveform — the brand's original story indicator, echoing the
  // Waves feature, instead of a ring-around-a-photo like FB/IG.
  return (
    <svg className="story-chip-wave" viewBox="0 0 44 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 6c2 0 2-4 4-4s2 4 4 4 2-4 4-4 2 4 4 4 2-4 4-4 2 4 4 4 2-4 4-4 2 4 4 4 2-4 4-4 2 4 4 4"
        stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
function StoriesRail({stories,onOpen,onCreate}){
  const trackRef=useRef(null);
  const order=["friends","following","creators","sellers","businesses"];
  const sorted=[...stories].sort((a,b)=>order.indexOf(a.group)-order.indexOf(b.group));
  const scrollBy=(d)=>trackRef.current && trackRef.current.scrollBy({left:d,behavior:"smooth"});

  // Click-and-drag horizontal scrolling for mouse/trackpad users, in
  // addition to native touch scrolling.
  const drag=useRef({active:false,startX:0,startScroll:0,moved:false});
  const onPointerDown=(e)=>{
    if(e.pointerType==="touch") return; // native touch scroll handles this
    const el=trackRef.current; if(!el) return;
    drag.current={active:true,startX:e.clientX,startScroll:el.scrollLeft,moved:false};
    el.setPointerCapture(e.pointerId);
  };
  const onPointerMove=(e)=>{
    const el=trackRef.current; if(!el || !drag.current.active) return;
    const dx=e.clientX-drag.current.startX;
    if(Math.abs(dx)>3) drag.current.moved=true;
    el.scrollLeft=drag.current.startScroll-dx;
  };
  const endDrag=()=>{ drag.current.active=false; };
  // Suppress the click that would otherwise fire on a story chip right
  // after a drag gesture ends.
  const onClickCapture=(e)=>{ if(drag.current.moved){ e.preventDefault(); e.stopPropagation(); drag.current.moved=false; } };

  return (
    <section className="stories">
      <button className="stories-arrow left" onClick={()=>scrollBy(-320)}><IconChevronLeft size={16}/></button>
      <div
        className="stories-track"
        ref={trackRef}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={endDrag}
        onPointerLeave={endDrag}
        onClickCapture={onClickCapture}
      >
        <button className="story-chip create" onClick={onCreate}>
          <span className="story-chip-avatar-wrap"><IconPlus size={20}/></span>
          <span className="story-chip-name">Your Story</span>
        </button>
        {sorted.map(s=>{
          const isSeller = s.group==="sellers"||s.group==="businesses";
          return (
            <button key={s.id} className={"story-chip"+(s.seen?"":" unseen")+(isSeller?" is-seller":"")} onClick={()=>onOpen(s)}>
              <span className="story-chip-avatar-wrap">
                <img className="story-chip-avatar" src={s.user.avatar} alt=""/>
                <span className="story-chip-ping"/>
                {isSeller && <span className="story-chip-store-badge"><IconSellerBadge size={10}/></span>}
              </span>
              <WaveGlyph/>
              <span className="story-chip-name">{isSeller ? (s.user.store||s.user.name) : s.user.name.split(" ")[0]}</span>
              {s.product && <span className="story-chip-price mono">{s.product.price}</span>}
            </button>
          );
        })}
      </div>
      <button className="stories-arrow right" onClick={()=>scrollBy(320)}><IconChevronRight size={16}/></button>
    </section>
  );
}

            <div className="modal-body">
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <img className="avatar" src={currentUser.avatar} width="40" height="40" alt=""/>
                <strong>{currentUser.name}</strong>
              </div>
              <textarea className="modal-textarea" placeholder="What's happening on Fockis?" value={text} onChange={e=>setText(e.target.value)} autoFocus/>
              {(attach==="photo"||attach==="video"||attach==="multi-photo"||attach==="wave"||attach==="product"||attach==="property") && (
                <div style={{borderRadius:16,overflow:"hidden",border:"1px solid var(--fk-border)"}}>
                  <img src={`https://picsum.photos/seed/fockis-composer-${attach}/800/500`} style={{width:"100%",display:"block",maxHeight:280,objectFit:"cover"}} alt=""/>
                </div>
              )}
              {attach==="poll" && (
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <input style={{border:"1px solid var(--fk-border)",borderRadius:12,padding:"9px 12px",background:"var(--fk-sunken)"}} defaultValue="Option A"/>
                  <input style={{border:"1px solid var(--fk-border)",borderRadius:12,padding:"9px 12px",background:"var(--fk-sunken)"}} defaultValue="Option B"/>
                </div>
              )}
              <div className="modal-attach-grid">
                {ATTACHMENTS.map(([id,label,Icon])=>(
                  <button key={id} className={"modal-attach"+(attach===id?" active":"")} onClick={()=>setAttach(attach===id?"text":id)}><Icon size={20}/>{label}</button>
                ))}
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={close}>Cancel</button>
              <button className="btn btn-primary" onClick={submit} disabled={!text.trim() && attach==="text"}>Post</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/* ---------- Sidebar / header / rail / bottom nav ---------- */
const NAV=[["home","Home",IconHome],["discover","Discover",IconDiscover],["friends","Friends",IconFriends],["waves","Waves",IconWaves],["messages","Messages",IconMessages,3],["notifications","Notifications",IconNotifications,12],["marketplace","Marketplace",IconMarketplace],["groups","Groups",IconGroups],["saved","Saved",IconSaved],["profile","Profile",IconProfile]];

function Sidebar({active,onChange,theme,toggleTheme}){
  return (
    <nav className="sidebar">
      <div className="sidebar-logo"><span className="logo"><span className="logo-mark"/>Fockis</span></div>
      <div className="sidebar-nav">
        {NAV.map(([id,label,Icon,badge])=>(
          <button key={id} className={"nav-item"+(active===id?" active":"")} onClick={()=>onChange(id)}>
            <Icon size={22}/><span>{label}</span>{badge && <span className="nav-badge">{badge}</span>}
          </button>
        ))}
      </div>
      <div className="sidebar-divider"/>
      <button className="sidebar-profile" onClick={()=>onChange("profile")}>
        <img className="avatar" src={currentUser.avatar} width="38" height="38" alt=""/>
        <span><span className="sidebar-profile-name">{currentUser.name}</span><span className="sidebar-profile-handle">@{currentUser.handle}</span></span>
      </button>
      <div className="sidebar-utility">
        <button className="icon-btn" onClick={toggleTheme}>{theme==="light"?<IconMoon size={19}/>:<IconSun size={19}/>}</button>
        <button className="icon-btn"><IconSettings size={19}/></button>
        <button className="icon-btn"><IconHelp size={19}/></button>
      </div>
    </nav>
  );
}
function TopBar(){
  return (
    <header className="topbar">
      <label className="topbar-search"><IconSearch size={18}/><input type="search" placeholder="Search Fockis"/></label>
      <div className="topbar-actions"><button className="icon-btn"><IconMessages size={20}/></button><button className="icon-btn"><IconNotifications size={20}/></button></div>
    </header>
  );
}
function MobileHeader(){
  return (
    <header className="mobile-header">
      <span className="logo"><span className="logo-mark"/>Fockis</span>
      <div className="mobile-header-actions"><button className="icon-btn"><IconSearch size={20}/></button><button className="icon-btn"><IconNotifications size={20}/></button><button className="icon-btn"><IconMessages size={20}/></button></div>
    </header>
  );
}
function RightRail(){
  const [followed,setFollowed]=useState({});
  return (
    <aside>
      <section className="rail-section">
        <div className="rail-header"><h2 className="rail-title"><IconTrend size={16}/>Trending</h2><a className="rail-see-all" href="#">See all</a></div>
        {trending.map(t=>(<div key={t.id} className="trend-item"><span className="trend-cat">{t.cat}</span><span className="trend-tag">{t.tag}</span><span className="trend-count mono">{t.count}</span></div>))}
      </section>
      <section className="rail-section">
        <div className="rail-header"><h2 className="rail-title"><IconFriends size={16}/>Suggested for you</h2></div>
        {suggested.map(p=>(
          <div key={p.id} className="suggestion-item">
            <img className="avatar" src={p.avatar} width="38" height="38" alt=""/>
            <div className="suggestion-meta"><p className="suggestion-name">{p.name}{p.verified && <IconVerified size={12} className="verified"/>}</p><p className="suggestion-sub">Suggested for you</p></div>
            <button className={"follow-chip"+(followed[p.id]?" following":"")} onClick={()=>setFollowed(f=>({...f,[p.id]:!f[p.id]}))}>{followed[p.id]?"Following":"Follow"}</button>
          </div>
        ))}
      </section>
      <section className="rail-section">
        <div className="rail-header"><h2 className="rail-title"><IconSellerBadge size={16}/>Discover sellers</h2></div>
        {sellersList.map(s=>(
          <div key={s.id} className="suggestion-item">
            <img className="avatar" src={s.avatar} width="38" height="38" alt=""/>
            <div className="suggestion-meta"><p className="suggestion-name">{s.store}</p><p className="suggestion-sub">Popular store</p></div>
            <button className={"follow-chip"+(followed["s"+s.id]?" following":"")} onClick={()=>setFollowed(f=>({...f,["s"+s.id]:!f["s"+s.id]}))}>{followed["s"+s.id]?"Following":"Follow"}</button>
          </div>
        ))}
      </section>
      <section className="rail-section">
        <div className="rail-header"><h2 className="rail-title"><IconMarketplace size={16}/>Marketplace highlights</h2><a className="rail-see-all" href="#">See all</a></div>
        <div className="market-grid">
          {marketHighlights.map(m=>(<div key={m.id} className="market-card"><img src={m.image} alt={m.name}/><div className="market-card-body"><p className="market-card-name">{m.name}</p><p className="market-card-price mono">{m.price}</p></div></div>))}
        </div>
      </section>
    </aside>
  );
}
function BottomNav({active,onChange,onCreate}){
  return (
    <nav className="bottom-nav">
      <button className={"bn-item"+(active==="home"?" active":"")} onClick={()=>onChange("home")}><IconHome size={22}/>Home</button>
      <button className={"bn-item"+(active==="discover"?" active":"")} onClick={()=>onChange("discover")}><IconDiscover size={22}/>Discover</button>
      <button className="bn-item" onClick={onCreate}><span className="bn-create"><IconPlus size={20}/></span>Create</button>
      <button className={"bn-item"+(active==="notifications"?" active":"")} onClick={()=>onChange("notifications")}><IconNotifications size={22}/>Activity</button>
      <button className={"bn-item"+(active==="profile"?" active":"")} onClick={()=>onChange("profile")}><IconProfile size={22}/>Profile</button>
    </nav>
  );
}

/* ---------- Root app ---------- */
function App(){
  const [theme,setTheme]=useState("light");
  const [activeNav,setActiveNav]=useState("home");
  const [activeTab,setActiveTab]=useState("for-you");
  const [posts,setPosts]=useState(initialPosts);
  const [stories,setStories]=useState(initialStories);
  const [openStory,setOpenStory]=useState(null);

  const update=(id,fn)=> setPosts(prev=>prev.map(p=>p.id===id?fn(p):p));
  const actions={
    onReact:(id)=>update(id,p=>({...p,reacted:!p.reacted,reactionCount:p.reactionCount+(p.reacted?-1:1)})),
    onComment:(id)=>update(id,p=>({...p,commentCount:p.commentCount+1})),
    onRepost:(id)=>update(id,p=>({...p,reposted:!p.reposted,repostCount:p.repostCount+(p.reposted?-1:1)})),
    onShare:(id)=>update(id,p=>({...p,shareCount:p.shareCount+1})),
    onSave:(id)=>update(id,p=>({...p,saved:!p.saved})),
    onFollow:(id)=>update(id,p=>({...p,author:{...p.author,following:!p.author.following}})),
    onVote:(id,optId)=>update(id,p=>{
      if(!p.poll || p.poll.votedOptionId) return p;
      return {...p, poll:{...p.poll, votedOptionId:optId, totalVotes:p.poll.totalVotes+1,
        options:p.poll.options.map(o=>o.id===optId?{...o,votes:o.votes+1}:o)}};
    }),
  };

  const createPost=(text,attach)=>{
    const typeMap={photo:"image","multi-photo":"multi-image",video:"video",wave:"wave",poll:"poll",product:"product",property:"property"};
    const newPost={id:"local-"+Date.now(),type:typeMap[attach]||"text",author:currentUser,createdAt:"Just now",caption:text||undefined,
      reactionCount:0,commentCount:0,repostCount:0,shareCount:0,
      images: attach==="photo" ? [img("fockis-new")] : undefined,
      poll: attach==="poll" ? {question:text||"New poll",totalVotes:0,votedOptionId:null,options:[{id:"a",label:"Option A",votes:0},{id:"b",label:"Option B",votes:0}]} : undefined};
    setPosts(prev=>[newPost,...prev]);
  };

  useEffect(()=>{ document.body.setAttribute("data-theme",theme); },[theme]);

  const filtered = useMemo(()=>{
    if(activeTab==="following") return posts.filter(p=>p.author.following);
    if(activeTab==="friends") return posts.filter(p=>p.author.friend);
    if(activeTab==="marketplace") return posts.filter(p=>p.type==="product"||p.type==="property");
    return posts;
  },[activeTab,posts]);

  return (
    <div>
      <MobileHeader/>
      <div className="shell">
        <div className="sidebar-col"><Sidebar active={activeNav} onChange={setActiveNav} theme={theme} toggleTheme={()=>setTheme(t=>t==="light"?"dark":"light")}/></div>
        <main className="center-col">
          <div className="center-inner">
            <TopBar/>
            <StoriesRail stories={stories} onOpen={(s)=>{setStories(prev=>prev.map(x=>x.id===s.id?{...x,seen:true}:x)); setOpenStory(s);}} onCreate={()=>alert("Fockis Story composer would open here.")}/>
            <FeedTabs active={activeTab} onChange={setActiveTab}/>
            {activeTab!=="waves" && <CreatePost onCreate={createPost}/>}

            {activeTab==="waves" ? (
              <div className="waves-grid">{waves.map(w=><WaveCard key={w.id} post={w} actions={actions}/>)}</div>
            ) : filtered.length ? filtered.map(post=>{
                if(post.type==="product") return <ProductPostCard key={post.id} post={post} actions={actions}/>;
                if(post.type==="property") return <PropertyPostCard key={post.id} post={post} actions={actions}/>;
                return <PostCard key={post.id} post={post} actions={actions}/>;
              }) : (
              <div className="empty-state">
                <div className="empty-icon"><IconWaves size={24}/></div>
                <p className="empty-title">Nothing here yet</p>
                <p className="empty-body">Posts matching this tab will show up here as your network grows.</p>
              </div>
            )}
          </div>
        </main>
        <div className="rail-col"><RightRail/></div>
      </div>
      <BottomNav active={activeNav} onChange={setActiveNav} onCreate={()=>document.querySelector(".composer-input")?.click()}/>

      {openStory && (
        <div className="modal-overlay" onClick={()=>setOpenStory(null)}>
          <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:360,aspectRatio:"9/16",borderRadius:22,overflow:"hidden",position:"relative",background:"#000"}}>
            <img src={openStory.preview} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>
            <div style={{position:"absolute",top:14,left:14,right:14,display:"flex",alignItems:"center",gap:8}}>
              <img className="avatar" src={openStory.user.avatar} width="32" height="32" alt=""/>
              <strong style={{color:"#fff",fontSize:14}}>{openStory.user.store||openStory.user.name}</strong>
              <button className="icon-btn" style={{marginLeft:"auto",color:"#fff"}} onClick={()=>setOpenStory(null)}><IconClose size={18}/></button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
